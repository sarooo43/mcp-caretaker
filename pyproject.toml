[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-caretaker"
dynamic = ["version"]
description = "Runtime behaviour tester for local MCP servers over stdio (pre-release skeleton)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saboor Nasar" }]
dependencies = ["mcp>=2.3.0,<2.4", "mcp-types>=2.3.0,<2.4"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
    "psutil>=7.2.2",
]

[project.scripts]
mcp-caretaker = "mcp_caretaker.cli:main"

[project.urls]
Homepage = "https://github.com/sarooo43/mcp-caretaker"
Source = "https://github.com/sarooo43/mcp-caretaker"
Issues = "https://github.com/sarooo43/mcp-caretaker/issues"

[tool.hatch.version]
path = "src/mcp_caretaker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_caretaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
extend-exclude = [
    "docs/decisions/0001-evidence",
    "docs/decisions/0003-evidence",
    "docs/decisions/0004-evidence",
]
